<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Somba Shopping Made Simple. An e-commerce website that makes shopping simple in Brazzaville.">
    <meta name="author" content="Relga-Zidrey Nkounkou">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/somba-home-page.css">
    <title>Somba Home</title>
</head>
<body>
    <main>
        <nav>
            <div class="logo-container">
                <div class="logo"><img src="images/logo.webp" alt="logo"></div>
                <input type="text" id="search" name="search" placeholder="Search products...">
            </div>

            <div class="nav-bar">
                <a href="#">Home</a>
                <a href="#">Checkout</a>
                <a href="#">Sign Up</a>
                <a href="#" class="shopping-cart"><img src="images/shopping_cart.svg" alt="shopping cart"><span id="count">3</span></a>
            </div>
        </nav>


        <div class="landing-page">

            <div class="landing-page-content">
                <h1>Original Tech, Without The Hassle</h1>
                <p>Iphone Pro 12, Air Pods 13, Original Headsets</p>
                <button id="shopping-btn">Shop Now</button>
                

                <div class="landing-page-icons">
                    <div><img src="images/safety_check.svg" alt="safety check icon">1-year guaranted</div>
                    <div><img src="images/local_shipping.svg" alt="local shipping icon">Free delivering in Brazzaville</div>
                    <div><img src="images/payments.svg" alt="payments icon">Payments secured</div>
                </div>
            </div>

            <div class="landing-hero">
                <img src="images/basket.webp" alt="landing hero">
            </div>
        </div>


        <div class="products">
            <div class="airpods">
                <img src="images/basket.webp" alt="Airpods image">
                <p id="description">Description of the image</p>
            </div>

            <div class="Iphone">
                <img src="images/basket.webp" alt="Airpods image">
                <p id="description">Description of the image</p>
            </div>
            
            <div class="headsets">
                <img src="images/basket.webp" alt="Airpods image">
                <p id="description">Description of the image</p>
            </div>
            
        </div>


    </main>
</body>
</html>
